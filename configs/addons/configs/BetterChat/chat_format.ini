// Оформление строк чата игроков. Перенесено из chat_processor
// (addons/translations/chat_processor.phrases.txt), чтобы после его
// отключения чат выглядел так же, как раньше.
//
// Ключ - тип сообщения, который присылает игра. Значение - как его рисовать:
//     {NAME}     ник игрока (у админов - уже с тегом и цветами из admin_tags.ini)
//     {MESSAGE}  текст сообщения (у админов - в их chat_color)
// Цвета - те же, что в admin_tags.ini.
//
// Если какого-то типа здесь нет, BetterChat оставит такое сообщение
// нетронутым (у chat_processor оно в этом случае пропадало целиком).
//
// Отключить переоформление полностью: "ChatFormat" в settings.ini = "0".
"ChatFormat"
{
	"Cstrike_Chat_All"		" {DEFAULT}[ВСЕМ]{TEAM} {NAME}{DEFAULT} {DEFAULT}➛ {MESSAGE}"
	"Cstrike_Chat_AllDead"	" {DEFAULT}[ВСЕМ]{DEFAULT} {NAME}{GRAY} [МЁРТВ] {DEFAULT}➛ {MESSAGE}"
	"Cstrike_Chat_AllSpec"	" {GRAY}[ЗРИТ]{DEFAULT} {NAME} ➛ {MESSAGE}"

	"Cstrike_Chat_CT"		" {DEFAULT}[КОМАНДА]{TEAM} {NAME}{DEFAULT} {DEFAULT}➛ {MESSAGE}"
	"Cstrike_Chat_T"		" {DEFAULT}[КОМАНДА]{TEAM} {NAME}{DEFAULT} {DEFAULT}➛ {MESSAGE}"
	"Cstrike_Chat_CT_Loc"	" {DEFAULT}[КОМАНДА]{TEAM} {NAME}{DEFAULT} {DEFAULT}➛ {MESSAGE}"
	"Cstrike_Chat_T_Loc"	" {DEFAULT}[КОМАНДА]{TEAM} {NAME}{DEFAULT} {DEFAULT}➛ {MESSAGE}"
	"Cstrike_Chat_CT_Dead"	" {DEFAULT}[КОМАНДА]{TEAM} {NAME}{GRAY} [МЁРТВ] {DEFAULT}➛ {MESSAGE}"
	"Cstrike_Chat_T_Dead"	" {DEFAULT}[КОМАНДА]{TEAM} {NAME}{GRAY} [МЁРТВ] {DEFAULT}➛ {MESSAGE}"
	"Cstrike_Chat_Spec"		" {GRAY}[КОМАНДА]{DEFAULT} {NAME} ➛ {MESSAGE}"
}
