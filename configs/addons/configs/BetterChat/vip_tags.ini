// Теги ВИПОК в чате. Теги админов - в admin_tags.ini.
//
// Ключ - название VIP-группы, как в addons/configs/vip/groups.ini. Випка
// получает тег своей группы автоматически, вписывать игроков не нужно.
// Группы, которых здесь нет, тега не получают.
//
// Цвета - те же названия, что в admin_tags.ini. Тег окрашен в цвет
// материала группы, ник - в цвет команды.
//
// Если у игрока есть и админский, и випский тег, он выбирает, какой
// показывать, командой !prefix. Одинаковые по тексту теги (superadmin,
// emerald - они совпадают с админскими ролями) в меню - один пункт.
//
// Изменения подхватываются после рестарта сервера.
// Выключить випские теги целиком: "VipTags" "0" в settings.ini.
"VipTags"
{
	"silver"
	{
		"tag"			"[SILVER]"
		"tag_color"		"{SILVER}"
		"name_color"	"{TEAM}"
		"chat_color"	"{DEFAULT}"
	}
	"gold"
	{
		"tag"			"[GOLD]"
		"tag_color"		"{GOLD}"
		"name_color"	"{TEAM}"
		"chat_color"	"{DEFAULT}"
	}
	"diamond"
	{
		"tag"			"[DIAMOND]"
		"tag_color"		"{LIGHTBLUE}"
		"name_color"	"{TEAM}"
		"chat_color"	"{DEFAULT}"
	}
	"diamondtest"
	{
		"tag"			"[DIAMOND]"
		"tag_color"		"{LIGHTBLUE}"
		"name_color"	"{TEAM}"
		"chat_color"	"{DEFAULT}"
	}
	"emerald"		// изумрудный = зелёный. Совпадает с админской ролью emerald.
	{
		"tag"			"[EMERALD]"
		"tag_color"		"{GREEN}"
		"name_color"	"{GRAYBLUE}"
		"chat_color"	"{GREEN}"
	}
	"superadmin"	// совпадает с админской ролью super_admin
	{
		"tag"			"[Супер-Админ]"
		"tag_color"		"{LIGHTOLIVE}"
		"name_color"	"{GRAYBLUE}"
		"chat_color"	"{DEFAULT}"
	}
}
