"GameManager"
{
	// Включить режим отладки (показывает все события в консоли)
	"DebugMode"		"0"

	// Кастомные сообщения о смене команды (1 = включено, 0 = выключено)
	"CustomTeamMessages"	"1"

	// Кастомные сообщения о подключении игрока (1 = включено, 0 = выключено)
	"CustomConnectMessages"	"1"

	// Кастомные сообщения об отключении игрока (1 = включено, 0 = выключено)
	"CustomDisconnectMessages"	"1"

	// НОВОЕ: защитный интервал (сек) от повторной печати сообщения о
	// подключении для одного и того же игрока. BetterChat вешается на
	// событие ClientPutInServer, которое и так стреляет один раз за реальный
	// вход (в отличие от старого chat_cleaner) - это просто доп. страховка.
	"ConnectDedupSeconds"	"3"

	// ЭКСПЕРИМЕНТАЛЬНО (по умолчанию выключено): подавляет нативную строку
	// "X is joining the Terrorists/CT" - она не идёт как чат-сообщение,
	// рисуется у клиента напрямую по игровому ивенту player_team, поэтому
	// её перехват отдельный и более рискованный механизм, чем всё остальное.
	// Если сервер начнёт вести себя странно после включения - верните "0".
	"SuppressNativeTeamJoinText"	"0"

	// Оформление чата игроков по chat_format.ini + теги админов из
	// admin_tags.ini. Заменяет chat_processor - его нужно выключить, иначе
	// оба будут переписывать одни и те же сообщения. "0" - чат как в игре.
	"ChatFormat"	"1"

	// Теги випкам по их VIP-группе (vip_tags.ini).
	// Берутся у VIP-плагина Pisex. Если после обновления VIP-плагина чат
	// начнёт вести себя странно - поставьте "0", випские теги отключатся,
	// всё остальное продолжит работать.
	"VipTags"	"1"
}
