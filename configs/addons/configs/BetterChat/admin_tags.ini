// Теги АДМИНОВ в чате. Теги випок - в vip_tags.ini.
//
// Ключ - флаг админки (admin_system, раздел "flags" в
// addons/configs/admin_system/core.ini). Флаги у игрока проверяются прямо в
// игре у админки - вписывать никого не нужно: выдал админку в панели, и тег
// появится сам.
//
// Порядок = приоритет: если у админа несколько флагов, берётся тот, что
// стоит ВЫШЕ в этом файле. Флаги, которых здесь нет (например r - резервный
// слот), тега не дают.
//
// Цвета: {DEFAULT} {WHITE} {RED} {LIGHTPURPLE} {GREEN} {LIME} {LIGHTGREEN}
//        {DARKRED} {GRAY} {LIGHTOLIVE} {OLIVE} {LIGHTBLUE} {BLUE} {PURPLE}
//        {LIGHTRED} {GRAYBLUE} {TEAM} {SILVER} {GOLD}
//
// Если у игрока есть и админский, и випский тег, он выбирает, какой
// показывать, командой !prefix (там же тег можно выключить). Одинаковые по
// тексту теги в меню - один пункт. Без выбора показывается админский.
//
// Изменения подхватываются после рестарта сервера.
// Выключить админские теги целиком: "AdminTags" "0" в settings.ini.
"AdminTags"
{
	"z"				// ROOT
	{
		"tag"			"[Создатель]"
		"tag_color"		"{LIGHTRED}"
		"name_color"	"{LIGHTGREEN}"
		"chat_color"	"{WHITE}"
	}
	"k"				// Куратор
	{
		"tag"			"[Куратор]"
		"tag_color"		"{LIGHTPURPLE}"
		"name_color"	"{GRAYBLUE}"
		"chat_color"	"{DEFAULT}"
	}
	"l"				// ЗамКуратор
	{
		"tag"			"[Зам. Куратор]"
		"tag_color"		"{LIGHTPURPLE}"
		"name_color"	"{GRAYBLUE}"
		"chat_color"	"{DEFAULT}"
	}
	"g"				// ГлАдмин
	{
		"tag"			"[Гл. Админ]"
		"tag_color"		"{LIGHTPURPLE}"
		"name_color"	"{GRAYBLUE}"
		"chat_color"	"{DEFAULT}"
	}
	"p"				// ЗамГлАдмин
	{
		"tag"			"[Зам. Гл. Админ]"
		"tag_color"		"{LIGHTPURPLE}"
		"name_color"	"{GRAYBLUE}"
		"chat_color"	"{DEFAULT}"
	}
	"x"				// СтМодератор
	{
		"tag"			"[Ст. Модератор]"
		"tag_color"		"{LIGHTBLUE}"
		"name_color"	"{GRAYBLUE}"
		"chat_color"	"{DEFAULT}"
	}
	"u"				// Модератор
	{
		"tag"			"[Модератор]"
		"tag_color"		"{LIGHTBLUE}"
		"name_color"	"{GRAYBLUE}"
		"chat_color"	"{DEFAULT}"
	}
	"s"				// SUPERADMIN - тот же тег, что у вип-группы superadmin
	{
		"tag"			"[Супер-Админ]"
		"tag_color"		"{LIGHTOLIVE}"
		"name_color"	"{GRAYBLUE}"
		"chat_color"	"{DEFAULT}"
	}
	"q"				// Админ
	{
		"tag"			"[Администратор]"
		"tag_color"		"{LIGHTOLIVE}"
		"name_color"	"{GRAYBLUE}"
		"chat_color"	"{DEFAULT}"
	}
	"h"				// Хелпер
	{
		"tag"			"[Хелпер]"
		"tag_color"		"{LIGHTBLUE}"
		"name_color"	"{GRAYBLUE}"
		"chat_color"	"{DEFAULT}"
	}
	"v"				// EMERALD - тот же тег, что у вип-группы emerald; изумрудный = зелёный
	{
		"tag"			"[EMERALD]"
		"tag_color"		"{GREEN}"
		"name_color"	"{GRAYBLUE}"
		"chat_color"	"{GREEN}"
	}
}
