// Теги АДМИНОВ в чате. Теги випок - в vip_tags.ini.
//
// Как добавить админа: впиши его SteamID в раздел "admins" и укажи роль
// из раздела "roles". SteamID можно писать в любом из форматов:
//     "76561198871494156"      (SteamID64)
//     "STEAM_1:0:455614214"    (SteamID2)
//     "[U:1:911228428]"        (SteamID3)
//
// Цвета: {DEFAULT} {WHITE} {RED} {LIGHTPURPLE} {GREEN} {LIME} {LIGHTGREEN}
//        {DARKRED} {GRAY} {LIGHTOLIVE} {OLIVE} {LIGHTBLUE} {BLUE} {PURPLE}
//        {LIGHTRED} {GRAYBLUE} {TEAM} {SILVER} {GOLD}
// Это те же названия, что были в chat_processor, и они дают тот же цвет
// ({SILVER} и {GOLD} добавлены для вип-тегов).
//
// Если у игрока есть и админский, и випский тег, он выбирает, какой
// показывать, командой !prefix (там же тег можно выключить). Одинаковые по
// тексту теги в меню - один пункт. Без выбора показывается админский.
//
// Изменения подхватываются после рестарта сервера.
"AdminTags"
{
	"admins"
	{
		"76561198871494156"		"owner"		// Alversite
	}

	"roles"
	{
		// Роли перенесены из chat_processor (addons/configs/chat_processor/admin.ini).
		// В скобках - флаг admin_system, которому роль соответствовала там.
		"owner"				// m
		{
			"tag"			"[Создатель]"
			"tag_color"		"{LIGHTRED}"
			"name_color"	"{LIGHTGREEN}"
			"chat_color"	"{WHITE}"
		}
		"curator"			// n
		{
			"tag"			"[Куратор]"
			"tag_color"		"{LIGHTPURPLE}"
			"name_color"	"{GRAYBLUE}"
			"chat_color"	"{DEFAULT}"
		}
		"deputy_curator"	// w
		{
			"tag"			"[Зам. Куратор]"
			"tag_color"		"{LIGHTPURPLE}"
			"name_color"	"{GRAYBLUE}"
			"chat_color"	"{DEFAULT}"
		}
		"head_admin"		// t
		{
			"tag"			"[Гл. Админ]"
			"tag_color"		"{LIGHTPURPLE}"
			"name_color"	"{GRAYBLUE}"
			"chat_color"	"{DEFAULT}"
		}
		"deputy_head_admin"	// i
		{
			"tag"			"[Зам. Гл. Админ]"
			"tag_color"		"{LIGHTPURPLE}"
			"name_color"	"{GRAYBLUE}"
			"chat_color"	"{DEFAULT}"
		}
		"senior_moder"		// e
		{
			"tag"			"[Ст. Модератор]"
			"tag_color"		"{LIGHTBLUE}"
			"name_color"	"{GRAYBLUE}"
			"chat_color"	"{DEFAULT}"
		}
		"moder"				// b
		{
			"tag"			"[Модератор]"
			"tag_color"		"{LIGHTBLUE}"
			"name_color"	"{GRAYBLUE}"
			"chat_color"	"{DEFAULT}"
		}
		"super_admin"		// o  (тот же тег, что у вип-группы superadmin)
		{
			"tag"			"[Супер-Админ]"
			"tag_color"		"{LIGHTOLIVE}"
			"name_color"	"{GRAYBLUE}"
			"chat_color"	"{DEFAULT}"
		}
		"admin"				// a
		{
			"tag"			"[Администратор]"
			"tag_color"		"{LIGHTOLIVE}"
			"name_color"	"{GRAYBLUE}"
			"chat_color"	"{DEFAULT}"
		}
		"helper"			// c
		{
			"tag"			"[Хелпер]"
			"tag_color"		"{LIGHTBLUE}"
			"name_color"	"{GRAYBLUE}"
			"chat_color"	"{DEFAULT}"
		}
		"emerald"			// v  (тот же тег, что у вип-группы emerald; изумрудный = зелёный)
		{
			"tag"			"[EMERALD]"
			"tag_color"		"{GREEN}"
			"name_color"	"{GRAYBLUE}"
			"chat_color"	"{GREEN}"
		}
		"checker"			// d
		{
			"tag"			"[Проверяющий]"
			"tag_color"		"{LIGHTOLIVE}"
			"name_color"	"{GRAYBLUE}"
			"chat_color"	"{LIGHTOLIVE}"
		}
	}
}
