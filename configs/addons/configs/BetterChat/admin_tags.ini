// Теги админов в чате.
//
// Как добавить админа: впиши его SteamID в раздел "admins" и укажи роль
// из раздела "roles". SteamID можно писать в любом из форматов:
//     "76561198871494156"      (SteamID64)
//     "STEAM_1:0:455614214"    (SteamID2)
//     "[U:1:911228428]"        (SteamID3)
//
// Цвета: {DEFAULT} {WHITE} {RED} {LIGHTPURPLE} {GREEN} {LIME} {LIGHTGREEN}
//        {DARKRED} {GRAY} {LIGHTOLIVE} {OLIVE} {LIGHTBLUE} {BLUE} {PURPLE}
//        {LIGHTRED} {GRAYBLUE} {TEAM}
// Это те же названия, что были в chat_processor, и они дают тот же цвет.
//
// Изменения подхватываются после рестарта сервера.
"AdminTags"
{
	"admins"
	{
		"76561198871494156"		"owner"		// Alversite
	}

	"roles"
	{
		// Роли перенесены из chat_processor (addons/configs/chat_processor/admin.ini).
		// В скобках - флаг admin_system, которому роль соответствовала там.
		"owner"				// m
		{
			"tag"			"[Создатель]"
			"tag_color"		"{LIGHTRED}"
			"name_color"	"{LIGHTGREEN}"
			"chat_color"	"{WHITE}"
		}
		"curator"			// n
		{
			"tag"			"[Куратор]"
			"tag_color"		"{LIGHTPURPLE}"
			"name_color"	"{GRAYBLUE}"
			"chat_color"	"{DEFAULT}"
		}
		"deputy_curator"	// w
		{
			"tag"			"[Зам. Куратор]"
			"tag_color"		"{LIGHTPURPLE}"
			"name_color"	"{GRAYBLUE}"
			"chat_color"	"{DEFAULT}"
		}
		"head_admin"		// t
		{
			"tag"			"[Гл. Админ]"
			"tag_color"		"{LIGHTPURPLE}"
			"name_color"	"{GRAYBLUE}"
			"chat_color"	"{DEFAULT}"
		}
		"deputy_head_admin"	// i
		{
			"tag"			"[Зам. Гл. Админ]"
			"tag_color"		"{LIGHTPURPLE}"
			"name_color"	"{GRAYBLUE}"
			"chat_color"	"{DEFAULT}"
		}
		"senior_moder"		// e
		{
			"tag"			"[Ст. Модератор]"
			"tag_color"		"{LIGHTBLUE}"
			"name_color"	"{GRAYBLUE}"
			"chat_color"	"{DEFAULT}"
		}
		"moder"				// b
		{
			"tag"			"[Модератор]"
			"tag_color"		"{LIGHTBLUE}"
			"name_color"	"{GRAYBLUE}"
			"chat_color"	"{DEFAULT}"
		}
		"super_admin"		// o
		{
			"tag"			"[Супер-Админ]"
			"tag_color"		"{LIGHTOLIVE}"
			"name_color"	"{GRAYBLUE}"
			"chat_color"	"{DEFAULT}"
		}
		"admin"				// a
		{
			"tag"			"[Администратор]"
			"tag_color"		"{LIGHTOLIVE}"
			"name_color"	"{GRAYBLUE}"
			"chat_color"	"{DEFAULT}"
		}
		"helper"			// c
		{
			"tag"			"[Хелпер]"
			"tag_color"		"{LIGHTBLUE}"
			"name_color"	"{GRAYBLUE}"
			"chat_color"	"{DEFAULT}"
		}
		"emerald"			// v
		{
			"tag"			"[EMERALD]"
			"tag_color"		"{LIGHTOLIVE}"
			"name_color"	"{GRAYBLUE}"
			"chat_color"	"{LIGHTOLIVE}"
		}
		"checker"			// d
		{
			"tag"			"[Проверяющий]"
			"tag_color"		"{LIGHTOLIVE}"
			"name_color"	"{GRAYBLUE}"
			"chat_color"	"{LIGHTOLIVE}"
		}
	}
}
